<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIPHER — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b14;--sb:#0d1321;--card:#1a2540;--card2:#111827;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --amber:#f59e0b;--blue:#3b82f6;--purple:#a855f7;--green:#22c55e;
  --red:#ef4444;--slate1:#f1f5f9;--slate2:#94a3b8;--slate3:#475569;
  --slate4:#1e293b;--slate5:#334155;--mono:'JetBrains Mono',monospace;
  --sans:'Outfit',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--slate1);font-family:var(--sans);font-size:14px}
/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
#sidebar{width:220px;min-width:220px;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#brand{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
#brand .logo{display:flex;align-items:center;gap:9px;margin-bottom:3px}
#brand .lock-wrap{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:flex-start;padding-left:7px;flex-shrink:0}
#brand .lock-icon{font-size:14px;line-height:1}
#brand .cipher-text{font-size:17px;font-weight:700;letter-spacing:.12em;color:#fff}
#brand .tagline{font-size:10px;color:var(--slate3);padding-left:39px}
#sec-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--slate5);padding:12px 14px 5px}
.sc-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer;text-align:left;transition:all .15s;margin-bottom:2px;color:var(--slate2)}
.sc-btn:hover{background:rgba(255,255,255,.04);color:var(--slate1)}
.sc-btn.active{background:rgba(255,255,255,.05);border-color:var(--border2);color:var(--slate1)}
.sc-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.sc-info .sc-name{font-size:12px;font-weight:500;line-height:1.3}
.sc-info .sc-tag{font-size:10px;color:var(--slate3);margin-top:1px}
#hist-section{flex:1;overflow-y:auto;padding:8px 10px}
#hist-section::-webkit-scrollbar{width:3px}
#hist-section::-webkit-scrollbar-thumb{background:var(--slate4);border-radius:2px}
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;margin-bottom:2px;cursor:default}
.hist-item .h-icon{font-size:10px;flex-shrink:0}
.hist-item .h-info .h-name{font-size:11px;font-weight:500;color:var(--slate2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .h-info .h-id{font-size:9px;font-family:var(--mono);color:var(--slate3)}
.hist-dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;flex-shrink:0}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#header{padding:10px 18px;background:rgba(13,19,33,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#hdr-left .hdr-title{font-size:13px;font-weight:600;color:var(--slate1)}
#hdr-left .hdr-sub{font-size:11px;color:var(--slate3)}
#hdr-right{display:flex;align-items:center;gap:10px}
#status-pill{font-size:11px;display:flex;align-items:center;gap:5px;transition:all .3s}
#replay-btn{font-size:11px;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--slate2);cursor:pointer;transition:all .15s;font-family:var(--sans)}
#replay-btn:hover{background:rgba(255,255,255,.07);color:var(--slate1)}
/* CHAT */
#chat{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:var(--slate4);border-radius:2px}
/* MESSAGES */
.msg{animation:fadeUp .3s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.row{display:flex;align-items:flex-end;gap:9px}
.row.user-row{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.cipher-avatar{background:linear-gradient(135deg,#f59e0b,#d97706)}
.user-avatar{background:#1d4ed8;font-size:10px;font-weight:600;color:#fff}
.bubble{padding:10px 14px;border-radius:16px;max-width:340px;font-size:13px;line-height:1.6}
.cipher-bubble{background:var(--card);color:var(--slate1);border-radius:16px 16px 16px 4px}
.user-bubble{background:#2563eb;color:#fff;border-radius:16px 16px 4px 16px;text-align:left}
.cursor{display:inline-block;width:2px;height:13px;background:var(--slate2);border-radius:1px;margin-left:2px;vertical-align:middle;animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* TYPING */
.typing-dots{display:flex;gap:4px;padding:12px 16px;background:var(--card);border-radius:16px 16px 16px 4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--slate2)}
.dot:nth-child(1){animation:dotbounce 1.2s 0s infinite}
.dot:nth-child(2){animation:dotbounce 1.2s .2s infinite}
.dot:nth-child(3){animation:dotbounce 1.2s .4s infinite}
@keyframes dotbounce{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:scale(1);opacity:1}}
/* CLASSIFY */
.classify-row{margin-left:39px}
.classify-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:8px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);font-size:11px;color:var(--slate2)}
.classify-badge .cb-domain{color:#c084fc;font-weight:600}
.classify-badge .cb-sep{color:var(--slate5)}
/* CHIPS */
.chips-wrap{margin-left:39px;display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--slate5);background:transparent;color:var(--slate2);font-size:12px;cursor:pointer;transition:all .2s;font-family:var(--sans)}
.chip:hover:not(.disabled){border-color:var(--blue);color:#93c5fd}
.chip.selected{background:var(--blue);border-color:var(--blue);color:#fff;cursor:default}
.chip.disabled:not(.selected){opacity:.35;cursor:default}
/* CONFIRM CARD */
.confirm-wrap{margin-left:39px;max-width:320px}
.confirm-card{background:var(--card);border:1px solid rgba(245,158,11,.25);border-radius:14px;padding:14px}
.confirm-header{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.confirm-header .c-icon{font-size:13px}
.confirm-header .c-title{font-size:12px;font-weight:600;color:var(--amber)}
.risk-badge{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.2);font-family:var(--mono)}
.confirm-rows{border-top:1px solid var(--slate4);border-bottom:1px solid var(--slate4);padding:8px 0;margin-bottom:10px}
.c-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:11px}
.c-row .ck{color:var(--slate3)}
.c-row .cv{color:var(--slate1);font-family:var(--mono);font-size:10.5px;text-align:right}
.confirm-actions{display:flex;gap:8px}
.btn-confirm{flex:1;padding:7px;border-radius:9px;background:#2563eb;color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .15s}
.btn-confirm:hover{background:#1d4ed8}
.btn-confirm:active{transform:scale(.97)}
.btn-cancel{padding:7px 12px;background:transparent;color:var(--slate3);border:none;font-size:12px;cursor:pointer;font-family:var(--sans);transition:color .15s}
.btn-cancel:hover{color:var(--slate2)}
/* AGENT TIMELINE */
.agent-wrap{margin-left:39px}
.agent-card{background:#0a0f1c;border:1px solid var(--slate4);border-radius:14px;padding:12px 14px;min-width:220px}
.agent-header{display:flex;align-items:center;gap:6px;margin-bottom:9px;font-size:11px;font-weight:600;color:#c084fc}
.agent-event{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;font-family:var(--mono)}
.ae-icon{font-size:11px;flex-shrink:0;width:14px;text-align:center}
.spin{display:inline-block;animation:spin .8s linear infinite;font-style:normal}
@keyframes spin{to{transform:rotate(360deg)}}
/* SUCCESS CARD */
.success-wrap{margin-left:39px;max-width:340px}
.success-card{background:var(--card);border:1px solid rgba(34,197,94,.2);border-radius:14px;padding:14px}
.success-header{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.success-title{font-size:12px;font-weight:600;color:var(--green)}
.success-req{font-size:10px;font-family:var(--mono);color:var(--slate3);margin-bottom:10px}
.guide-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 10px;background:#0a0f1c;border:1px solid var(--slate4);border-radius:9px;color:var(--slate2);font-size:11px;cursor:pointer;font-family:var(--sans);margin-bottom:6px;transition:border-color .15s}
.guide-toggle:hover{border-color:var(--slate3)}
.guide-content{background:#0a0f1c;border-radius:9px;padding:10px 12px;margin-bottom:8px;display:none}
.guide-content.open{display:block}
.guide-row{margin-bottom:8px}
.guide-row:last-child{margin-bottom:0}
.guide-k{font-size:10px;color:var(--slate3);margin-bottom:2px}
.guide-v{font-size:10.5px;font-family:var(--mono);color:var(--slate2);word-break:break-all}
/* NEXT STEPS TIMELINE */
.timeline{margin-top:8px;padding:8px 10px;background:#0a0f1c;border-radius:9px}
.tl-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px}
.tl-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px}
.tl-done{background:rgba(34,197,94,.15);color:var(--green)}
.tl-pending{background:rgba(245,158,11,.1);color:var(--amber)}
.tl-todo{background:var(--slate4);color:var(--slate3)}
.tl-text{color:var(--slate2)}
/* EMAIL/SECURE NOTICE */
.secure-notice{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.12);border-radius:9px;margin-top:6px;font-size:11px;color:var(--slate3)}
.sn-icon{flex-shrink:0;margin-top:1px;font-size:12px}
/* READ RESULT */
.read-card{background:var(--card);border:1px solid rgba(34,197,94,.15);border-radius:14px;padding:12px 14px;font-size:11px}
.read-header{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:600;color:var(--green)}
.read-rows{display:grid;gap:5px}
.read-row{display:flex;justify-content:space-between;gap:10px}
.read-k{color:var(--slate3)}
.read-v{font-family:var(--mono);font-size:10.5px;color:var(--slate1)}
/* TOAST */
#toast{position:fixed;top:14px;right:16px;background:#0d1321;border:1px solid rgba(34,197,94,.3);border-radius:11px;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--slate1);z-index:9999;transform:translateX(120%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#toast.show{transform:translateX(0)}
#toast .toast-icon{font-size:14px;flex-shrink:0}
/* ERROR MSG */
.error-bubble{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;border-radius:16px 16px 16px 4px}
/* INPUT */
#input-area{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
#input-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:8px 12px;transition:border-color .2s}
#input-row:focus-within{border-color:rgba(59,130,246,.4)}
#msg-input{flex:1;background:transparent;border:none;outline:none;color:var(--slate1);font-size:13px;font-family:var(--sans);caret-color:var(--amber)}
#msg-input::placeholder{color:var(--slate3)}
#send-btn{width:28px;height:28px;border-radius:8px;background:#2563eb;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
#send-btn:hover{background:#1d4ed8}
#send-btn:active{transform:scale(.92)}
/* STATUS BAR */
#statusbar{padding:5px 18px;background:var(--bg);border-top:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--slate5);flex-shrink:0}
#statusbar .sb-dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block}
#statusbar .sb-sep{color:var(--slate4)}
/* WAITING HINT */
#waiting-hint{text-align:center;padding:6px;font-size:11px;color:var(--amber);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="brand">
      <div class="logo">
        <div class="lock-wrap"><span class="lock-icon">🔐</span></div>
        <span class="cipher-text">CIPHER</span>
      </div>
      <div class="tagline">IAM Assistant · POC v1.0</div>
    </div>

    <div id="sec-label">Scenarios</div>
    <div style="padding:0 8px">
      <button class="sc-btn active" onclick="startScenario('sso')" id="btn-sso">
        <div class="sc-icon" style="background:rgba(59,130,246,.15)">🔑</div>
        <div class="sc-info">
          <div class="sc-name">OIDC Onboarding</div>
          <div class="sc-tag">SSO · Ping Federate</div>
        </div>
      </button>
      <button class="sc-btn" onclick="startScenario('pam')" id="btn-pam">
        <div class="sc-icon" style="background:rgba(245,158,11,.15)">🛡️</div>
        <div class="sc-info">
          <div class="sc-name">CyberArk Safe</div>
          <div class="sc-tag">PAM · CyberArk</div>
        </div>
      </button>
      <button class="sc-btn" onclick="startScenario('iga')" id="btn-iga">
        <div class="sc-icon" style="background:rgba(34,197,94,.12)">👥</div>
        <div class="sc-info">
          <div class="sc-name">Saviynt Group</div>
          <div class="sc-tag">IGA · Saviynt</div>
        </div>
      </button>
      <button class="sc-btn" onclick="startScenario('read')" id="btn-read">
        <div class="sc-icon" style="background:rgba(168,85,247,.12)">🔍</div>
        <div class="sc-info">
          <div class="sc-name">Status Check</div>
          <div class="sc-tag">Read · No confirm</div>
        </div>
      </button>
      <button class="sc-btn" onclick="startScenario('cross')" id="btn-cross">
        <div class="sc-icon" style="background:rgba(99,102,241,.15)">⚡</div>
        <div class="sc-info">
          <div class="sc-name">Cross-domain</div>
          <div class="sc-tag">SSO + IGA · 2 ops</div>
        </div>
      </button>
    </div>

    <div id="sec-label" style="margin-top:8px">Request History</div>
    <div id="hist-section">
      <div id="hist-empty" style="font-size:11px;color:var(--slate5);padding:2px 6px">None yet</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div id="header">
      <div id="hdr-left">
        <div class="hdr-title" id="hdr-title">OIDC Onboarding</div>
        <div class="hdr-sub" id="hdr-sub">SSO · Ping Federate</div>
      </div>
      <div id="hdr-right">
        <div id="status-pill"></div>
        <button id="replay-btn" onclick="replayScenario()">↺ Replay</button>
      </div>
    </div>

    <div id="chat"></div>
    <div id="waiting-hint" style="display:none">⬆ Click Confirm above to proceed</div>

    <div id="input-area">
      <div id="input-row">
        <input id="msg-input" type="text" placeholder="Ask CIPHER anything about IAM..." autocomplete="off">
        <button id="send-btn" onclick="sendUserMsg()" title="Send">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div id="statusbar">
      <span class="sb-dot"></span>
      <span>Ollama · llama3.1:8b</span>
      <span class="sb-sep">·</span>
      <span>RAG active</span>
      <span class="sb-sep">·</span>
      <span>CIPHER v1.0 POC</span>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast">
  <span class="toast-icon">📧</span>
  <span id="toast-msg">Confirmation sent · IAM team notified</span>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let currentScenario = 'sso';
let timers = [];
let waitingForConfirm = false;
let resumeFn = null;
let advanceFn = null;
let completedRequests = [];

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function uid(){ return Date.now() + Math.floor(Math.random()*9999); }
function chat(){ return document.getElementById('chat'); }
function after(ms, fn){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearAll(){ timers.forEach(clearTimeout); timers = []; }
function scrollBottom(){ const c=chat(); c.scrollTop=c.scrollHeight; }
function setStatus(text, color){
  const p = document.getElementById('status-pill');
  p.innerHTML = text ? `<span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block;margin-right:5px"></span><span style="font-size:11px;color:${color}">${text}</span>` : '';
}
function showHint(v){ document.getElementById('waiting-hint').style.display = v ? 'block' : 'none'; }
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  after(3800, () => t.classList.remove('show'));
}

// ─── DOM BUILDERS ─────────────────────────────────────────────────────────────
function cipherRow(id){
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.id = 'msg-' + id;
  wrap.innerHTML = `<div class="row"><div class="avatar cipher-avatar">🔐</div><div class="bubble cipher-bubble" id="bub-${id}"></div></div>`;
  chat().appendChild(wrap);
  scrollBottom();
  return document.getElementById('bub-' + id);
}
function userRow(text){
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.innerHTML = `<div class="row user-row"><div class="bubble user-bubble">${text}</div><div class="avatar user-avatar">MH</div></div>`;
  chat().appendChild(wrap);
  scrollBottom();
}
function typingRow(){
  const wrap = document.createElement('div');
  wrap.id = 'typing-msg';
  wrap.className = 'msg';
  wrap.innerHTML = `<div class="row"><div class="avatar cipher-avatar">🔐</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chat().appendChild(wrap);
  scrollBottom();
}
function removeTyping(){ const t = document.getElementById('typing-msg'); if(t) t.remove(); }
function addClassify(domain, action){
  const wrap = document.createElement('div');
  wrap.className = 'msg classify-row';
  wrap.innerHTML = `<div class="classify-badge">⚡ Intent classified &nbsp;<span class="cb-domain">${domain}</span><span class="cb-sep">›</span>${action}</div>`;
  chat().appendChild(wrap);
  scrollBottom();
}
function addChips(chips, onSelect){
  const id = 'chips-' + uid();
  const wrap = document.createElement('div');
  wrap.id = id;
  wrap.className = 'msg chips-wrap';
  chips.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = c;
    btn.onclick = () => {
      if(btn.classList.contains('disabled')) return;
      wrap.querySelectorAll('.chip').forEach(b => { b.classList.remove('selected'); b.classList.add('disabled'); });
      btn.classList.add('selected');
      btn.classList.remove('disabled');
      after(200, () => onSelect(c));
    };
    wrap.appendChild(btn);
  });
  chat().appendChild(wrap);
  scrollBottom();
  return id;
}
function selectChip(containerId, value){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  wrap.querySelectorAll('.chip').forEach(b => {
    b.classList.add('disabled');
    if(b.textContent === value) b.classList.add('selected');
  });
}

// ─── STREAMING ────────────────────────────────────────────────────────────────
function streamText(el, text, onDone){
  const words = text.split(' ');
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  const tick = () => {
    i++;
    const cur = el.querySelector('.cursor');
    if(cur) cur.remove();
    el.textContent = words.slice(0,i).join(' ');
    if(i < words.length){
      const c = document.createElement('span'); c.className='cursor'; el.appendChild(c);
      after(38 + Math.random()*28, tick);
    } else {
      after(180, () => { onDone && onDone(); });
    }
  };
  after(60, tick);
}

// ─── AGENT TIMELINE ───────────────────────────────────────────────────────────
function addAgentTimeline(events, onDone){
  const id = 'agent-' + uid();
  const wrap = document.createElement('div');
  wrap.className = 'msg agent-wrap';
  wrap.id = id;
  wrap.innerHTML = `<div class="agent-card"><div class="agent-header">⚡ Agent Activity</div><div id="ae-list-${id}"></div></div>`;
  chat().appendChild(wrap);
  scrollBottom();
  let idx = 0;
  function showNext(){
    const list = document.getElementById('ae-list-' + id);
    if(idx > 0){
      const prev = list.lastChild;
      if(prev){ const ic = prev.querySelector('.ae-icon'); if(ic) ic.innerHTML = '✅'; const t = prev.querySelector('.ae-text'); if(t) t.style.color = 'var(--slate3)'; }
    }
    if(idx >= events.length){ scrollBottom(); after(300, onDone); return; }
    const row = document.createElement('div');
    row.className = 'agent-event';
    row.innerHTML = `<span class="ae-icon"><i class="spin" style="display:inline-block">⟳</i></span><span class="ae-text" style="color:var(--slate1)">${events[idx]}</span>`;
    list.appendChild(row);
    idx++;
    scrollBottom();
    after(idx < events.length ? 780 : 500, showNext);
  }
  after(200, showNext);
}

// ─── CONFIRM CARD ─────────────────────────────────────────────────────────────
function addConfirmCard(rows, riskLabel, onConfirm, onCancel){
  const wrap = document.createElement('div');

// ─── SCENARIO ENGINE ─────────────────────────────────────────────────────────
function startScenario(sc){
  clearAll();

  resumeFn = null;
  currentScenario = sc;
  document.getElementById('chat').innerHTML = '';
  showHint(false);
  document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + sc);
  if(btn) btn.classList.add('active');
  const meta = { sso:['OIDC Onboarding','SSO · Ping Federate'], pam:['CyberArk Safe (with error recovery)','PAM · CyberArk'], iga:['Saviynt Group','IGA · Saviynt'], read:['Status Check','SSO · Ping Federate — Read only'], cross:['Cross-domain Request','SSO + IGA · 2 operations'] };
  const [title, sub] = meta[sc] || ['CIPHER','IAM Assistant'];
  document.getElementById('hdr-title').textContent = title;
  document.getElementById('hdr-sub').textContent = sub;
  setStatus('','');
  after(600, () => {
    const bub = cipherRow(uid());
    streamText(bub, "Welcome. I'm CIPHER — your IAM assistant. Watch how I handle a " + title.toLowerCase() + " request end to end.", () => {
      after(400, () => SCENARIOS[sc]());
    });
  });
}

function addHistory(id, name, domain){

}
