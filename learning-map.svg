    <text x="698" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1E3A8A">• Argus, Cipher, ICP proof-of-concepts</text>
    <text x="698" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1E3A8A">• Multi-agent onboarding</text>
    <text x="698" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1E3A8A">• Architecture and demo assets</text>
    <text x="698" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1E3A8A">• Portfolio-ready outputs</text>
