    <text x="172" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#334155">From IAM fundamentals to AI, cloud, security, and eventual applied project delivery</text>
    <text x="172" y="792" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">This roadmap captures the broad course architecture of the repository in one visual overview</text>
