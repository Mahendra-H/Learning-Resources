    <text x="1108" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">• Prompt templates</text>
    <text x="1108" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">• Migration guides</text>
    <text x="1108" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">• Research notes</text>
    <text x="1108" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">• Reusable themes</text>
