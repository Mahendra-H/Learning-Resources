  </g>

  <text x="140" y="145" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Learning Resource Map</text>
  <text x="140" y="181" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="19">A complete at-a-glance view of the repository’s major learning paths, tools, and projects</text>

